
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101426">
<title>PhotoBoost AI - Photo Enhancer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101426;
  color: white;
}

header {
  padding: 22px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #a78bfa;
}

main {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

p {
  color: #b8bfd2;
  text-align: center;
  line-height: 1.6;
}

.upload {
  margin-top: 30px;
  padding: 30px 15px;
  text-align: center;
  border: 2px dashed #8b5cf6;
  border-radius: 18px;
  background: #1b2138;
}

.upload label {
  display: inline-block;
  padding: 14px 24px;
  background: #7c3aed;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

input {
  display: none;
}

#preview {
  display: none;
  width: 100%;
  margin-top: 20px;
  border-radius: 12px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#7c3aed,#a855f7);
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.ad {
  margin-top: 30px;
  padding: 25px;
  background: #1b2138;
  border-radius: 10px;
  text-align: center;
  color: #929bb2;
}

footer {
  padding: 25px;
  text-align: center;
  color: #929bb2;
}
</style>
</head>

<body>

<header>✨ PhotoBoost AI</header>

<main>

<h1>Enhance Your Photos</h1>

<p>Transform your ordinary photos into beautiful HD images with AI.</p>

<div class="upload">

<h3>Upload Your Photo</h3>

<p>Select a photo from your iPhone</p>

<label for="photo">📸 Choose Photo</label>

<input type="file" id="photo"
accept="image/jpeg,image/png,image/webp">

<img id="preview">

</div>

<button onclick="enhancePhoto()">
✨ Enhance Photo
</button>

<div id="message"></div>

<div class="ad">
Advertisement Space
</div>

</main>

<footer>
© 2026 PhotoBoost AI
</footer>

<script>

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");

photo.addEventListener("change", function() {

const file = this.files[0];

if (!file) return;

if (file.size > 10 * 1024 * 1024) {
alert("Photo must be under 10 MB");
this.value = "";
return;
}

preview.src = URL.createObjectURL(file);
preview.style.display = "block";

});

function enhancePhoto() {

if (!photo.files.length) {
alert("Please upload a photo first!");
return;
}

document.getElementById("message").innerHTML =
"<p>AI engine coming soon!</p>";

}

</script>

</body>
</html>
